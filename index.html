<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3f1fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ぺんぎん勤怠">
  <meta name="description" content="勤怠アプリのスクショを読み込むだけで、フレックスの残り時間を計算します">
  <title>ぺんぎん勤怠</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="scene" aria-hidden="true">
    <div class="scene-bg"></div>
    <div class="scene-fade"></div>
  </div>
  <div id="particles" aria-hidden="true"></div>
  <div id="confetti" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <button class="nav-btn" id="btnPrev" aria-label="前の月">‹</button>
      <div class="title">
        <h1 id="monthTitle">&nbsp;</h1>
        <p id="seasonName" class="season-name">&nbsp;</p>
      </div>
      <button class="nav-btn" id="btnNext" aria-label="次の月">›</button>
    </header>

    <main>
      <section class="stage" id="stage">
        <div class="bubble" id="bubble"><span id="bubbleText"></span></div>
        <button class="mascot" id="mascot" aria-label="ペンギン(タップすると話します)">
          <img id="mascotImg" alt="" width="371" height="387">
          <span class="mascot-shadow"></span>
        </button>
      </section>

      <section class="hero card" id="hero"></section>

      <section class="import-row">
        <button class="btn btn-primary" id="btnImport">📷 スクショを読み込む</button>
        <button class="btn btn-ghost" id="btnPaste">📋 貼り付け</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </section>

      <section class="card list" id="list" aria-label="日ごとの勤務"></section>

      <p class="foot-note" id="footNote"></p>
      <div class="foot-row">
        <button class="btn btn-ghost" id="btnSettings">⚙︎ 設定・バックアップ</button>
      </div>
    </main>
  </div>

  <div id="sheetRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
